<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechDeals - Bonnes affaires High-Tech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>TechDeals</h1>
    <p>Les meilleures offres Smartphones, Tablettes & PC</p>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher un produit ou une marque...">
    </div>
  </header>

  <main class="container">
    <!-- Zone où s'affichent les cartes générées depuis le JSON -->
    <div id="deals-container" class="grid">
      <p style="color: white; text-align: center; grid-column: 1/-1;">Chargement des meilleures offres...</p>
    </div>
  </main>

  <script>
    // 1. Fonction principale : va chercher le fichier deals.json mis à jour par Make/Gemini
    async function loadDeals() {
      const container = document.getElementById('deals-container');

      try {
        // Date.now() empêche le navigateur de garder une vieille version en mémoire (cache)
        const response = await fetch('deals.json?t=' + Date.now());
        if (!response.ok) throw new Error('Impossible de charger le fichier deals.json');

        const deals = await response.json();
        renderDeals(deals);
      } catch (error) {
        console.error('Erreur :', error);
        container.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">Impossible de charger les promos pour le moment.</p>';
      }
    }

    // 2. Fonction qui crée l'élément HTML (carte) pour chaque promo du JSON
    function renderDeals(deals) {
      const container = document.getElementById('deals-container');
      container.innerHTML = ''; // Re-nettoie le conteneur

      deals.forEach(deal => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.category = deal.category || 'all';

        card.innerHTML = `
          <div class="card-image">
            <img src="${deal.imageUrl}" alt="${deal.title}">
            ${deal.discount ? `<span class="badge">-${deal.discount}%</span>` : ''}
          </div>
          <div class="card-content">
            <h3>${deal.title}</h3>
            <div class="prices">
              ${deal.oldPrice ? `<span class="old-price">${deal.oldPrice} €</span>` : ''}
              <span class="new-price">${deal.newPrice} €</span>
            </div>
            <p class="description">${deal.description}</p>
            <a href="${deal.link}" target="_blank" rel="noopener noreferrer" class="btn">Voir l'offre</a>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // 3. Barre de recherche dynamique
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchValue = e.target.value.toLowerCase().trim();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const title = card.querySelector('h3').textContent.toLowerCase();
        if (title.includes(searchValue)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    });

    // 4. Lancement automatique dès que la page est chargée
    document.addEventListener('DOMContentLoaded', loadDeals);
  </script>

</body>
</html>
